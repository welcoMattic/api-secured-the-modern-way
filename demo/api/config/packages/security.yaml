security:
    providers:
        # OIDC n'a aucune notion de rôle : ce provider mappe les claims vers des ROLE_*
        oidc:
            id: App\Security\OidcUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: oidc
            access_token:
                token_handler:
                    # Vérification OFFLINE : la signature suffit, aucun appel réseau par requête
                    oidc:
                        algorithms: ['RS256']
                        audience: '%env(OIDC_AUDIENCE)%'
                        issuers: ['%env(OIDC_ISSUER)%']
                        discovery:
                            base_uri: '%env(OIDC_DISCOVERY_BASE_URI)%'
                            cache:
                                id: cache.app
                    # Vérification ONLINE : un appel HTTP au Provider à chaque requête entrante
                    # oidc_user_info:
                    #     base_uri: '%env(OIDC_DISCOVERY_BASE_URI)%'
                    #     claim: sub
                    #     discovery:
                    #         cache:
                    #             id: cache.app

    access_control: []
