api_platform:
    title: 'API Photos'
    description: "Resource server de démonstration. Il ne connaît aucun compte : il vérifie les access tokens émis par Keycloak."
    version: 1.0.0
    formats:
        jsonld:
            - application/ld+json
        html:
            - text/html
    enable_swagger_ui: true
    enable_re_doc: false
    enable_scalar: false
    defaults:
        stateless: true
        cache_headers:
            vary: [Content-Type, Authorization, Origin]
