api_platform:
    title: 'CloudPics API'
    description: "Les photos d'Alice vivent ici. CloudPics API est un simple resource server : il ne connaît aucun compte et ne délivre aucun token, il vérifie ceux que CloudPics ID a émis."
    version: 1.0.0
    formats:
        jsonld:
            - application/ld+json
        html:
            - text/html
    enable_swagger_ui: true
    enable_re_doc: false
    enable_scalar: false
    defaults:
        stateless: true
        cache_headers:
            vary: [Content-Type, Authorization, Origin]
    # Le seul flow que le talk montre : authorization_code + PKCE, avec le client
    # public cloudpics-docs. Ce seul bloc de config documente le schéma OAuth2 dans
    # l'OpenAPI ET câble le bouton « Authorize » de Swagger UI.
    oauth:
        enabled: true
        clientId: cloudpics-docs
        pkce: true
        type: oauth2
        flow: authorizationCode
        authorizationUrl: '%env(OIDC_ISSUER)%/protocol/openid-connect/auth'
        tokenUrl: '%env(OIDC_ISSUER)%/protocol/openid-connect/token'
        refreshUrl: '%env(OIDC_ISSUER)%/protocol/openid-connect/token'
        # Les scopes que le realm photos connaît. photos:read et photos:write sont ceux
        # qu'un client demande à l'utilisateur de lui déléguer : CloudPics ID n'accorde
        # chacun que si l'utilisateur détient le rôle realm correspondant, et le rôle
        # n'apparaît dans realm_access.roles que si le scope a été accordé.
        scopes:
            openid: "Active OIDC : sans lui, Keycloak ne fait que de l'OAuth2"
            profile: "Informations de profil de base (nom, prénom)"
            email: "Adresse email vérifiée de l'utilisateur"
            'photos:read': "Voir les photos de l'utilisateur"
            'photos:write': "Déposer des photos au nom de l'utilisateur"
    swagger:
        # Deuxième schéma, pour les clients qui détiennent déjà un access token
        # (un CI, un curl, un client généré) et n'ont rien à négocier.
        http_auth:
            bearer:
                scheme: bearer
                bearerFormat: JWT
        persist_authorization: true
