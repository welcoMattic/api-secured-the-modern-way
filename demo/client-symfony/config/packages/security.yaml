security:
    # Pas de mots de passe locaux : toute l'authentification passe par CloudPics ID
    providers:
        oidc:
            # Provider natif : il fabrique un OidcUser à partir des claims, sans base locale,
            # et ne laisse aucun claim définir l'identité ni accorder de rôle.
            oidc: ~

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: oidc
            # Le flow authorization_code, nativement, sans bundle externe.
            oidc_login:
                provider_uri: '%env(OIDC_ISSUER)%'
                client_id: '%env(OIDC_CLIENT_ID)%'
                # Comment le client s'authentifie au token endpoint (RFC 6749 §2.3.1) :
                # client_secret_basic (recommandé), client_secret_post, none (client public)
                # ou id (nom d'un service).
                client_authentication:
                    client_secret_basic: '%env(OIDC_CLIENT_SECRET)%'
                # openid seul ne suffirait pas : sans profile ni email, le endpoint userinfo
                # ne renvoie ni preferred_username ni email. Et sans photos:read ni
                # photos:write, CloudPics ID n'inscrit aucun rôle dans l'access token :
                # ces deux scopes sont ce que PhotoBook demande à Alice de lui déléguer.
                scope: ['openid', 'profile', 'email', 'photos:read', 'photos:write']
                # PKCE S256 et la vérification de la signature de l'ID token contre le JWKS
                # sont actifs par défaut (pkce, id_token_signature), rien à écrire.
                # Le JWKS est mis en cache dans cache.app.
                # RP-Initiated Logout : « Se déconnecter » ferme aussi la session chez CloudPics ID ;
                # CloudPics ID valide post_logout_redirect_uri contre les post.logout.redirect.uris
                # du client photobook (déjà dans le realm Keycloak).
                enable_end_session: true
                post_logout_redirect_path: app_home
                # Le Provider redirige ici après authentification. La route est déclarée
                # par le route loader du bundle, importé dans config/routes/security.yaml.
                check_path: /login_check
                # Le bouton « Se connecter » vise /login, qui est protégé : l'authenticator
                # est le point d'entrée du firewall, il part droit chez CloudPics ID sans
                # page intermédiaire. login_path ne sert plus qu'aux handlers.
                login_path: /login
                # Un échec ne doit surtout pas renvoyer sur /login, qui relancerait le flow
                # en boucle devant la salle.
                failure_path: /
                # Le document de découverte est mis en cache une heure
                discovery_cache_ttl: 3600
            logout:
                path: app_logout
                target: app_home

    access_control:
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/session/oublier$, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        # /login n'est PAS public : c'est justement son refus qui déclenche le point d'entrée.
        - { path: ^/, roles: ROLE_USER }
