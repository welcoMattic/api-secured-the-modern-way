# Thème de login de la démo.
#
# Il n'existe que pour une raison : le thème keycloak.v2 déclare darkMode=true et
# suit prefers-color-scheme. Sur un portable en mode sombre, la page de login
# sortirait en sombre, entre un deck clair et deux apps clientes claires. Or c'est
# le moment central de la démonstration.
parent=keycloak.v2
darkMode=false
